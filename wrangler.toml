name = "chittyadvocate"
main = "src/index.js"
compatibility_date = "2026-03-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "advocate.chitty.cc/*", zone_name = "chitty.cc" }
]

# Durable Object — the sputnik agent
[durable_objects]
bindings = [
  { name = "ADVOCATE_AGENT", class_name = "AdvocateAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdvocateAgent"]

# KV for content cache and freshness metadata (Phase 2)
# [[kv_namespaces]]
# binding = "CONTENT_CACHE"
# id = ""  # TODO: create KV namespace

# R2 for static article storage (Phase 2)
# [[r2_buckets]]
# binding = "ARTICLES"
# bucket_name = "chittyadvocate-articles"
[[tail_consumers]]
service = "chittytrack"

# Curation schedule — daily freshness check
# [triggers]
# crons = ["0 6 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
destinations = ["chittytrack-logs"]

[observability.traces]
enabled = true
head_sampling_rate = 1
destinations = ["chittytrack-traces"]
persist = false
